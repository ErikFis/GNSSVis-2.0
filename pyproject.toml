[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnssvis"
version = "0.1.0"
description = "Radio telescope observation analysis: GNSS satellite detection, ephemerides, and spectro-temporal waterfall visualization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Erik H Limeira", email = "erik.henrique@estudante.ufcg.edu.br" }]
keywords = [
    "gnss", "radio astronomy", "satellite", "waterfall", "ephemeris",
    "fits", "signal processing", "radiotelescope", "skyfield", "astropy"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "scipy>=1.8",
    "skyfield>=1.46",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/ErikFis/gnssvis"
Repository = "https://github.com/ErikFis/gnssvis"
"Bug Tracker" = "https://github.com/ErikFis/gnssvis/issues"

[tool.setuptools.packages.find]
where = ["src"]
